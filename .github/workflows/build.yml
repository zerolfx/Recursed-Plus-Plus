name: Build Windows patch

on:
  push:
    # Every branch, so the exe for a change in progress can be downloaded from its own run.
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository contents
        shell: pwsh
        run: ./tools/check-repository.ps1
      - name: Download and verify Lua
        shell: pwsh
        run: ./tools/bootstrap.ps1
      - name: Build x86 plugin, launcher, and tests
        shell: cmd
        run: build.cmd
      - name: Run tests without proprietary game files
        shell: pwsh
        run: |
          ./build/ci_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'CI tests failed.' }
      - name: Package the downloads
        shell: pwsh
        run: ./tools/package.ps1
      - name: Upload the executable players download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Recursed-Plus-Plus
          path: |
            dist/Recursed-Plus-Plus.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload the developer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Recursed-Plus-Plus-developer-windows-x86
          path: |
            dist/Recursed-Plus-Plus-developer-windows-x86.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    # A tag is the one place a player can download the executable as a plain file, without the zip
    # the artifact UI wraps everything in. Only this job can write, and only a tag reaches it.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Recursed-Plus-Plus*
          merge-multiple: true
          path: dist
      - name: Publish the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Re-running a tagged build must not fail on a release that is already there, so the
        # release is created only when it is missing and the files are replaced either way.
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/Recursed-Plus-Plus.exe dist/Recursed-Plus-Plus-developer-windows-x86.zip dist/SHA256SUMS.txt --clobber
